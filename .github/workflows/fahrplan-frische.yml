# Fahrplan-Frische (Gate I5, Prüfung E-029): Die Bus- und Bahndaten der Ortsseiten gelten bis zum Samstag vor dem
# Fahrplanwechsel (lib/places/datenklassen.ts, FAHRPLAN_STAND.gueltigBis). Danach gehen alle Ortsseiten mit diesem Stand
# auf noindex,follow. Täglich prüft dieser Workflow den Bericht aus lib/places/frische.ts und hält ab 28 Tagen vorher
# genau ein Issue offen; ist neu gerechnet, schließt er es. Die CI schlägt 14 Tage vorher fehl.
#
# Bewusst minimale Rechte: Code lesen und Issues schreiben, sonst nichts. Kein Deploy, kein Push.

name: Fahrplan-Frische

on:
  schedule:
    # Täglich 05:23 UTC (vor Arbeitsbeginn in Wetzlar), nicht zur vollen Stunde und nicht zugleich mit der Stellen-Frische.
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  frische:
    name: Stand der Fahrplandaten prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Bericht erzeugen
        id: bericht
        run: |
          bun -e "
            const { FAHRPLAN_ISSUE_TITEL, fahrplanBericht, fahrplanText } = await import('./lib/places/frische.ts');
            const now = new Date();
            const text = fahrplanText(fahrplanBericht(now), now);
            await Bun.write('fahrplan.md', text);
            console.log('titel=' + FAHRPLAN_ISSUE_TITEL);
            console.log('offen=' + (text === '' ? 'nein' : 'ja'));
          " >> "$GITHUB_OUTPUT"
          cat fahrplan.md

      - name: Issue anlegen, aktualisieren oder schließen
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: ${{ steps.bericht.outputs.titel }}
          OFFEN: ${{ steps.bericht.outputs.offen }}
        run: |
          nummer="$(gh issue list --state open --search "\"$TITEL\" in:title" --json number,title \
            --jq "map(select(.title == env.TITEL)) | .[0].number // empty")"
          if [ "$OFFEN" = "ja" ]; then
            if [ -n "$nummer" ]; then
              gh issue edit "$nummer" --body-file fahrplan.md
            else
              gh issue create --title "$TITEL" --body-file fahrplan.md
            fi
          elif [ -n "$nummer" ]; then
            gh issue close "$nummer" --comment "Die Fahrplandaten gelten wieder länger als 28 Tage."
          fi
